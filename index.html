<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bisutería Elly</title>
<style>
:root{--purple:#7b3f98;--pink:#e9a9c7;--soft:#fff8fc;--ink:#332b35;--muted:#786f79}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#fff;color:var(--ink)}
header{background:linear-gradient(135deg,#fff,#fff3fa);padding:26px 6%;position:sticky;top:0;z-index:5;border-bottom:1px solid #f1e3eb}
.nav{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-weight:800;font-size:25px;color:var(--purple)}.tag{font-size:12px;color:var(--muted)}
.hero{max-width:1100px;margin:35px auto;padding:42px 6%;border-radius:28px;background:linear-gradient(135deg,#faf2ff,#fff);display:flex;justify-content:space-between;align-items:center;gap:25px}.hero h1{font-size:clamp(36px,6vw,64px);margin:0 0 10px;color:var(--purple)}.hero p{font-size:18px;color:var(--muted)}.btn{display:inline-block;background:var(--purple);color:#fff;text-decoration:none;padding:13px 20px;border-radius:999px;font-weight:700;border:0;cursor:pointer}
.wrap{max-width:1100px;margin:0 auto;padding:0 6% 50px}.filters{display:flex;gap:9px;flex-wrap:wrap;margin:25px 0}.filter{border:1px solid #ead9e5;background:#fff;border-radius:999px;padding:9px 15px;cursor:pointer}.filter.active{background:var(--pink);border-color:var(--pink)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px}.card{border:1px solid #eee2e9;border-radius:20px;overflow:hidden;background:#fff;box-shadow:0 6px 22px #4c2c4c0d}.photo{aspect-ratio:1/1;background:#faf4f8;display:flex;align-items:center;justify-content:center;color:#aa91a5;font-size:13px}.photo img{width:100%;height:100%;object-fit:cover}.info{padding:16px}.cat{font-size:12px;color:var(--purple);font-weight:700}.name{font-size:18px;font-weight:800;margin:5px 0}.price{font-size:17px;margin:8px 0 14px}.wa{display:block;text-align:center;background:#f5d5e5;color:#542f50;text-decoration:none;padding:10px;border-radius:12px;font-weight:700}
footer{text-align:center;padding:30px;background:#fbf3f8;color:var(--muted);font-size:13px}
@media(max-width:600px){.hero{margin:18px 4%;padding:30px 22px}.hero .btn{margin-top:10px}.nav{padding:0 4%}.brand{font-size:21px}}
</style>
</head>
<body>
<header><div class="nav"><div><div class="brand" id="brand">Bisutería Elly</div><div class="tag">Detalles que hacen la diferencia</div></div><a class="btn" href="#catalogo">Ver catálogo</a></div></header>
<section class="hero"><div><h1>Bisutería Elly</h1><p>Descubre piezas bonitas para cada ocasión.</p><a class="btn" href="#catalogo">Explorar piezas</a></div></section>
<main class="wrap" id="catalogo"><h2>Catálogo</h2><div class="filters" id="filters"></div><div class="grid" id="grid"></div></main>
<footer>© <span id="year"></span> Bisutería Elly · Pedidos por WhatsApp</footer>
<script>
const WA="523325126976";
const products=[
{id:1,name:"Anillo Aurora",price:299,cat:"Anillos",desc:"Pieza de demostración. Sustitúyela desde Admin.",img:""},
{id:2,name:"Collar Luna",price:399,cat:"Collares",desc:"Pieza de demostración.",img:""},
{id:3,name:"Pulsera Siena",price:249,cat:"Pulseras",desc:"Pieza de demostración.",img:""},
{id:4,name:"Aretes Rosa",price:199,cat:"Aretes",desc:"Pieza de demostración.",img:""}
];
const cats=["Todos",...new Set(products.map(p=>p.cat))];
let active="Todos";
function money(n){return new Intl.NumberFormat("es-MX",{style:"currency",currency:"MXN"}).format(n)}
function render(){
document.getElementById("filters").innerHTML=cats.map(c=>`<button class="filter ${c===active?'active':''}" onclick="active='${c}';render()">${c}</button>`).join("");
let list=active==="Todos"?products:products.filter(p=>p.cat===active);
document.getElementById("grid").innerHTML=list.map(p=>`<article class="card"><div class="photo">${p.img?`<img src="${p.img}" alt="${p.name}">`:"Foto de producto"}</div><div class="info"><div class="cat">${p.cat}</div><div class="name">${p.name}</div><div class="price">${money(p.price)}</div><a class="wa" target="_blank" href="https://wa.me/${WA}?text=${encodeURIComponent("Hola, me interesa "+p.name+" de "+money(p.price)+". ¿Está disponible?")}">Comprar por WhatsApp</a></div></article>`).join("");
}
document.getElementById("year").textContent=new Date().getFullYear();render();
</script>
</body></html>
